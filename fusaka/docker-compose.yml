name: local-ethereum-fusaka
services:
  create-beacon-chain-genesis:
    image: "gcr.io/offchainlabs/prysm/cmd/prysmctl:v7.1.3"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    command:
      - testnet
      - generate-genesis
      - --fork=fulu
      - --num-validators=64
      - --output-ssz=/config/genesis.ssz
      - --chain-config-file=/config/config.yml
      - --geth-genesis-json-in=/config/genesis.json
      - --geth-genesis-json-out=/config/genesis.json
    volumes:
      - ./config:/config

  geth-genesis:
    image: "ethereum/client-go:v1.16.7"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    command: --datadir=/execution/data --db.engine=leveldb init /config/genesis.json
    volumes:
      - ./node/consensus:/consensus
      - ./node/execution:/execution
      - ./config/genesis.json:/config/genesis.json
    depends_on:
      create-beacon-chain-genesis:
        condition: service_completed_successfully

  beacon-chain:
    container_name: eth-beacon-node
    image: "gcr.io/offchainlabs/prysm/beacon-chain:v7.1.3"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    command:
      - --datadir=/consensus/beacondata
      - --genesis-state=/config/genesis.ssz
      - --interop-eth1data-votes
      - --chain-config-file=/config/config.yml
      - --contract-deployment-block=0
      - --chain-id=1337
      - --rpc-host=0.0.0.0
      - --rpc-port=${BEACON_RPC_PORT:-4000}
      - --grpc-gateway-host=0.0.0.0
      - --grpc-gateway-port=${BEACON_GRPC_GATEWAY_PORT:-3500}
      - --execution-endpoint=http://geth:${AUTH_RPC_PORT:-8551}
      - --accept-terms-of-use
      - --jwt-secret=/config/jwtsecret
      - --suggested-fee-recipient=0x433709CF62264892851143deCF13094080aeEDF9
      - --force-clear-db
      - --minimum-peers-per-subnet=0
      - --p2p-tcp-port=13000
      - --p2p-udp-port=12000
      - --peer=${PEER:-}
      - --checkpoint-sync-url=${CHECKPOINT_SYNC_URL:-}
      - --genesis-beacon-api-url=${CHECKPOINT_SYNC_URL:-}
      - --bootstrap-node=${BOOT_STRAP_NODE:-}
      - --min-sync-peers=0
    ports:
      - ${BIND_ADDR:-127.0.0.1}:${BEACON_RPC_PORT:-4000}:${BEACON_RPC_PORT:-4000}
      - ${BIND_ADDR:-127.0.0.1}:${BEACON_GRPC_GATEWAY_PORT:-3500}:${BEACON_GRPC_GATEWAY_PORT:-3500}
      - ${BIND_ADDR:-127.0.0.1}:13000:13000
      - ${BIND_ADDR:-127.0.0.1}:12000:12000/udp
    volumes:
      - ./config:/config
      - ./node/consensus:/consensus
      - ./node/execution:/execution
    depends_on:
      create-beacon-chain-genesis:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"

  geth:
    container_name: eth-geth-node
    image: "ethereum/client-go:v1.16.7"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    command:
      - --datadir=/execution/data
      - --syncmode=full
      - --networkid=1337
      - --port=30303
      - --http
      - --http.api=eth,net,debug,web3,txpool
      - --http.addr=0.0.0.0
      - --http.port=${RPC_PORT:-8545}
      - --http.corsdomain=*
      - --http.vhosts=*
      - --ws
      - --ws.api=eth,net,web3
      - --ws.addr=0.0.0.0
      - --ws.port=${WS_PORT:-8546}
      - --ws.origins=*
      - --authrpc.vhosts=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=${AUTH_RPC_PORT:-8551}
      - --authrpc.jwtsecret=/config/jwtsecret
      - --nodiscover
      - --db.engine=leveldb
      - --rpc.allow-unprotected-txs=true
      - --miner.gasprice=0
      - --metrics
      - --metrics.addr=0.0.0.0
      - --metrics.port=6060
    ports:
      - ${BIND_ADDR:-127.0.0.1}:6060:6060 # metrics
      - ${BIND_ADDR:-127.0.0.1}:30303:30303
      - ${BIND_ADDR:-127.0.0.1}:${AUTH_RPC_PORT:-8551}:${AUTH_RPC_PORT:-8551} # AUTH RPC
      - ${BIND_ADDR:-127.0.0.1}:${RPC_PORT:-8545}:${RPC_PORT:-8545} # RPC
      - ${BIND_ADDR:-127.0.0.1}:${WS_PORT:-8546}:${WS_PORT:-8546} # WS
    volumes:
      - ./node/execution:/execution
      - ./config:/config
    depends_on:
        geth-genesis:
          condition: service_completed_successfully
        beacon-chain:
          condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"

  prometheus:
    container_name: eth-prometheus
    image: "prom/prometheus:v3.3.0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - ${BIND_ADDR:-127.0.0.1}:9090:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      geth:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  grafana:
    container_name: eth-grafana
    image: "grafana/grafana:11.6.0"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - ${BIND_ADDR:-127.0.0.1}:3000:3000
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  validator:
    container_name: eth-validator-node
    image: "gcr.io/offchainlabs/prysm/validator:v7.1.3"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    command:
      - --datadir=/consensus/validatordata
      - --chain-config-file=/config/config.yml
      - --beacon-rpc-provider=beacon-chain:${BEACON_RPC_PORT:-4000}
      - --accept-terms-of-use
      - --interop-num-validators=64
      - --enable-db-backup-webhook=true
      - --rpc-host=0.0.0.0
      - --rpc-port=7000
      - --grpc-gateway-host=0.0.0.0
      - --grpc-gateway-port=7000
      - --monitoring-host=0.0.0.0
      - --monitoring-port=8081
      - --force-clear-db
    ports:
      - ${BIND_ADDR:-127.0.0.1}:7000:7000
      - ${BIND_ADDR:-127.0.0.1}:7500:7500
      - ${BIND_ADDR:-127.0.0.1}:8081:8081
    volumes:
      - ./node/consensus:/consensus
      - ./config:/config
    depends_on:
      beacon-chain:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
